                }
                // 对于big，尝试左对齐和右对齐（1/2宽度）
                else if (size === 'big') {
                    const bigWidth = (gridWidth - gap) / 2;
                    candidateXs.push(0, bigWidth + gap);
                }
                // 对于medium，使用45%宽度，尝试多个位置
                else if (size === 'medium') {
                    const mediumWidth = gridWidth * 0.45;
                    candidateXs.push(0, mediumWidth + gap, mediumWidth * 2 + gap * 2);
                }
                // 默认情况
                else {
                    candidateXs.push(0);
                }
                
                // 也尝试一些中间位置（更灵活的布局）
                for (let x = 0; x <= gridWidth - cardWidth; x += 20) {
                    if (!candidateXs.includes(x)) {
                        candidateXs.push(x);
                    }
                }
                
                // 对每个候选x位置，找到最低的y位置
                candidateXs.forEach(x => {
                    if (x + cardWidth > gridWidth) return; // 超出边界
                    
                    let maxY = 0;
                    
                    // 检查与已放置项目的重叠
                    for (const item of placedItems) {
                        // 检查水平方向是否重叠
                        const horizontalOverlap = !(x + cardWidth <= item.x || x >= item.x + item.width);
                        
                        if (horizontalOverlap) {
                            // 有重叠，y位置必须在已放置项目下方
                            maxY = Math.max(maxY, item.y + item.height + gap);
                        }
                    }
                    
                    // 如果这个位置比之前找到的最佳位置更低，更新最佳位置
                    if (maxY < minY) {
                        minY = maxY;
                        bestX = x;
                        bestY = maxY;
                    }
                });
                
                // 如果找不到合适位置，放在顶部
                if (minY === Infinity) {
                    bestY = 0;
                }
                
                // 移动端强制从左侧开始
                if (isSmallWindow) {
                    bestX = 0;
                }
                
                // 设置卡片位置和尺寸
                card.style.left = bestX + 'px';
                card.style.top = bestY + 'px';
                card.style.width = cardWidth + 'px';
                
                // 记录这个项目的占用区域
                placedItems.push({
                    x: bestX,
                    y: bestY,
                    width: cardWidth,
                    height: cardHeight
                });
            });

            // 计算容器总高度
            let maxHeight = 0;
            placedItems.forEach(item => {
                maxHeight = Math.max(maxHeight, item.y + item.height);
            });
            grid.style.height = maxHeight + 'px';
            
            // 布局完成后显示网格
            grid.classList.add('loaded');
            
            isLayouting = false;
        }

        // 渲染项目网格
        function renderProjects(category = 'all') {
            const grid = document.getElementById('projectsGrid');
            
            // 切换目录时先隐藏网格，避免布局跳动
            grid.classList.remove('loaded');
            
            // 强制触发重排，确保隐藏立即生效
            void grid.offsetHeight;
            
            const filteredProjects = category === 'all' 
                ? projects 
                : projects.filter(p => p.category === category);
            
            grid.innerHTML = filteredProjects.map((project, index) => {
                // 布局判断：<= 1024px 使用移动端布局，> 1024px 使用桌面端布局
                const isMobileLayout = window.innerWidth <= 1024;
                // OSS使用判断：< 480px 使用OSS，>= 480px 使用本地文件
                const isMobileOSS = window.innerWidth < 480;
                
                // 封面图
                let coverHTML;
                if (project.cover) {
                    // getResourceUrl: < 480px 返回OSS URL，>= 480px 返回本地路径（不使用OSS）
                    const coverUrl = getResourceUrl(project.cover);
                    if (isMobileLayout) {
                        // 移动端布局（<= 1024px）：第一张图片eager加载，其他lazy加载
                        const loadingMode = index === 0 ? 'eager' : 'lazy';
                        coverHTML = `<img src="${coverUrl}" alt="${project.title}" class="cover-image" loading="${loadingMode}">`;
                    } else {
                        // 桌面端布局（> 1024px）：使用本地文件，不使用OSS
                        coverHTML = `<img src="${coverUrl}" alt="${project.title}" class="cover-image">`;
                    }
                } else {
                    coverHTML = '<div class="cover-image" style="background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>';
                }
                
                // 预览视频
                let previewVideoHTML = '';
                if (project.video && project.video.src) {
                    if (project.video.type === 'video') {
                        // getResourceUrl: < 480px 返回OSS URL，>= 480px 返回本地路径（不使用OSS）
                        const videoUrl = getResourceUrl(project.video.src);
                        // 移动端布局（<= 1024px）：preload="none" 不预加载，避免卡顿和流量消耗
                        // 桌面端布局（> 1024px）：preload="metadata" 预加载元数据，支持hover播放
                        const preloadMode = isMobileLayout ? 'none' : 'metadata';
                        previewVideoHTML = `<video src="${videoUrl}" class="preview-video" loop muted playsinline preload="${preloadMode}"></video>`;
                    } else if (project.video.type === 'youtube') {
                        // YouTube 不支持悬停预览，使用封面
                        previewVideoHTML = '';
                    } else if (project.video.type === 'bilibili') {
                        // Bilibili 不支持悬停预览，使用封面
                        previewVideoHTML = '';
                    }
                }
                
                // 获取项目尺寸，默认为small
                const size = project.size || 'small';
                
                // 判断是否有预览视频
                const hasVideo = project.video && project.video.src && project.video.type === 'video';
                const videoClass = hasVideo ? 'has-video' : '';
                
                // 移动端布局：根据 orientation 参数添加视频方向类
                let orientationClass = '';
                if (isMobileLayout && hasVideo && project.orientation) {
                    if (project.orientation === 'landscape') {
                        orientationClass = 'video-landscape';  // 横版 4:3
                    } else if (project.orientation === 'portrait') {
                        orientationClass = 'video-portrait';   // 竖版 3:4
                    }
                    // 'square' 或不设置则保持默认 1:1
                }
                
                return `
                    <div class="project-card size-${size} ${videoClass} ${orientationClass}" 
                         data-project-id="${project.id}"
                         onclick="openModal(${project.id})"
                         onmouseenter="playPreview(${project.id})"
                         onmouseleave="pausePreview(${project.id})">
                        <div class="project-image">
                            ${coverHTML}
                            ${previewVideoHTML}
                            <div class="video-loading-spinner">
                                <svg viewBox="0 0 36 36">
                                    <circle class="progress-bg" cx="18" cy="18" r="15.5"></circle>
                                    <circle class="progress-bar" cx="18" cy="18" r="15.5" 
                                            stroke-dasharray="97.4" 
                                            stroke-dashoffset="97.4"></circle>
                                </svg>
                            </div>
                        </div>
                        <div class="project-info">
                            <h3 class="project-title">${project.title}</h3>
                            <div class="project-tags">
                                ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 等待DOM更新后执行瀑布流布局
            setTimeout(() => {
                layoutMasonry();
            }, 50);

            // 等待所有图片/视频加载并更新宽高比
            const cards = grid.querySelectorAll('.project-card');
            cards.forEach(card => {
                const imageContainer = card.querySelector('.project-image');
                if (!imageContainer) return;
                
                // 优先使用视频的实际宽高比，如果没有视频则使用封面图
                const coverImage = card.querySelector('img.cover-image');
                const previewVideo = card.querySelector('video.preview-video');
                
                // 标记是否已经设置了比例
                let aspectRatioSet = false;
                
                // 优先使用视频的实际宽高比
                if (previewVideo) {
                    if (previewVideo.readyState >= 2 && previewVideo.videoWidth && previewVideo.videoHeight) {
                        // 视频已加载，直接使用视频比例
                        updateVideoAspectRatio(previewVideo);
                        aspectRatioSet = true;
                    } else {
                        // 等待视频元数据加载
                        previewVideo.addEventListener('loadedmetadata', () => {
                            if (previewVideo.videoWidth && previewVideo.videoHeight) {
                                updateVideoAspectRatio(previewVideo);
                                aspectRatioSet = true;
                            }
                        }, { once: true });
                        previewVideo.addEventListener('error', () => {
                            // 视频加载失败，尝试使用封面图的实际比例
                            if (coverImage && coverImage.src) {
                                if (coverImage.complete && coverImage.naturalWidth && coverImage.naturalHeight) {
                                    updateImageAspectRatio(coverImage);
                                    aspectRatioSet = true;
                                } else {
                                    coverImage.addEventListener('load', () => {
                                        if (coverImage.naturalWidth && coverImage.naturalHeight) {
                                            updateImageAspectRatio(coverImage);
                                            aspectRatioSet = true;
                                        }
                                    }, { once: true });
                                    coverImage.addEventListener('error', () => {
                                        // 封面图也加载失败，使用默认值
                                        setTimeout(() => {
                                            if (!aspectRatioSet) {
                                                setImageContainerHeight(imageContainer, 0.5625);
                                                setTimeout(() => layoutMasonry(), 50);
                                            }
                                        }, 1000);
                                    }, { once: true });
                                }
                            } else {
                                // 没有封面图，使用默认值
                                setTimeout(() => {
                                    if (!aspectRatioSet) {
                                        setImageContainerHeight(imageContainer, 0.5625);
                                        setTimeout(() => layoutMasonry(), 50);
                                    }
                                }, 1000);
                            }
                        }, { once: true });
                    }
                } else if (coverImage && coverImage.src) {
                    // 没有视频，使用封面图的实际宽高比
                    if (coverImage.complete && coverImage.naturalWidth && coverImage.naturalHeight) {
                        updateImageAspectRatio(coverImage);
                        aspectRatioSet = true;
                    } else {
                        coverImage.addEventListener('load', () => {
                            if (coverImage.naturalWidth && coverImage.naturalHeight) {
                                updateImageAspectRatio(coverImage);
                                aspectRatioSet = true;
                            }
                        }, { once: true });
                        coverImage.addEventListener('error', () => {
                            // 封面图加载失败，使用默认值
                            setTimeout(() => {
                                if (!aspectRatioSet) {
                                    setImageContainerHeight(imageContainer, 0.5625);
                                    setTimeout(() => layoutMasonry(), 50);
                                }
                            }, 1000);
                        }, { once: true });
                    }
                } else {
                    // 既没有封面图也没有视频，使用默认高度（仅作为后备方案）
                    setTimeout(() => {
                        if (!aspectRatioSet) {
                            setImageContainerHeight(imageContainer, 0.5625);
                        }
                    }, 500);
                }
            });
            
            // 确保布局执行
            setTimeout(() => layoutMasonry(), 100);
        }

        // 播放预览视频
        function playPreview(projectId) {
            const card = document.querySelector(`[data-project-id="${projectId}"]`);
            if (!card) return;
            
            const video = card.querySelector('.preview-video');
            if (video) {
                // 有视频元素，尝试播放
                video.play().catch(err => {
                    console.log('Video play failed:', err);
                });
            }
            // 如果没有视频元素，不执行任何操作（封面图会保持显示）
        }

        // 暂停预览视频
        function pausePreview(projectId) {
            const card = document.querySelector(`[data-project-id="${projectId}"]`);
            if (!card) return;
            
            const video = card.querySelector('.preview-video');
            if (video) {
                video.pause();
                video.currentTime = 0;
            }
        }

        // 当前打开的项目和媒体索引
        let currentProject = null;
        let currentMediaIndex = 0;

        // 打开弹出层
        function openModal(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            // 先停止所有预览视频，避免同时播放
            const previewVideos = document.querySelectorAll('.preview-video');
            previewVideos.forEach(video => {
                video.pause();
                video.currentTime = 0;
            });

            currentProject = project;
            currentMediaIndex = 0;

            // 设置项目信息
            document.getElementById('modalTitle').textContent = project.title;
            document.getElementById('modalDescription').textContent = project.description;
            document.getElementById('modalTime').textContent = project.time;
            document.getElementById('modalTools').textContent = project.tools;
            
            const tagsContainer = document.getElementById('modalTags');
            tagsContainer.innerHTML = project.tags.map(tag => 
                `<span class="modal-tag">${tag}</span>`
            ).join('');

            // 渲染媒体
            renderMedia();
            
            // 显示/隐藏箭头
            updateMediaControls();

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 渲染媒体
        function renderMedia() {
            if (!currentProject) {
                document.getElementById('modalMediaContainer').innerHTML = '<div class="media-placeholder">No Media</div>';
                return;
            }

            // 构建完整媒体列表：主视频 + 额外媒体
            const allMedia = [];
            
            // 添加主视频
            if (currentProject.video && currentProject.video.src) {
                allMedia.push(currentProject.video);
            }
            
            // 添加额外媒体
            if (currentProject.media && currentProject.media.length > 0) {
                allMedia.push(...currentProject.media);
            }
            
            // 如果没有任何媒体
            if (allMedia.length === 0) {
                document.getElementById('modalMediaContainer').innerHTML = '<div class="media-placeholder">No Media</div>';
                return;
            }

            const media = allMedia[currentMediaIndex];
            const container = document.getElementById('modalMediaContainer');
            
            let mediaHTML = '';
            
            if (!media.src) {
                mediaHTML = '<div class="media-placeholder">Project Media</div>';
            } else if (media.type === 'image') {
                // getResourceUrl: 移动端返回OSS URL，桌面端返回本地路径（不使用OSS）
                const imageUrl = getResourceUrl(media.src);
                mediaHTML = `<img src="${imageUrl}" class="modal-image" alt="${currentProject.title}">`;
            } else if (media.type === 'video') {
                // getResourceUrl: 移动端返回OSS URL，桌面端返回本地路径（不使用OSS）
                const videoUrl = getResourceUrl(media.src);
                // 视频自动播放并带声音（移动端使用OSS，桌面端使用本地文件）
                mediaHTML = `<video src="${videoUrl}" class="modal-video" controls autoplay></video>`;
            } else if (media.type === 'youtube') {
                // YouTube - 所有视频都自动播放
                mediaHTML = `<iframe class="modal-video" src="https://www.youtube.com/embed/${media.src}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else if (media.type === 'bilibili') {
                // Bilibili - 所有视频都自动播放
                mediaHTML = `<iframe class="modal-video" src="//player.bilibili.com/player.html?bvid=${media.src}&page=1&autoplay=1" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>`;
            }
            
            // 添加控制箭头和导航点
            mediaHTML += `
                <div class="media-arrow prev ${allMedia.length > 1 ? '' : 'hidden'}" id="mediaPrev">‹</div>
                <div class="media-arrow next ${allMedia.length > 1 ? '' : 'hidden'}" id="mediaNext">›</div>
                <div class="media-nav" id="mediaNav"></div>
            `;
            
            container.innerHTML = mediaHTML;
            
            // 对于本地视频，确保自动播放并带声音
            if (media.type === 'video') {
                const videoElement = container.querySelector('video.modal-video');
                if (videoElement) {
                    videoElement.muted = false; // 确保有声音
                    videoElement.play().catch(err => {
                        console.log('视频自动播放失败，可能需要用户交互:', err);
                    });
                }
            }
            
            // 渲染导航点
            renderMediaNav(allMedia.length);
            
            // 绑定箭头事件
            if (allMedia.length > 1) {
                document.getElementById('mediaPrev').onclick = () => changeMedia(-1);
                document.getElementById('mediaNext').onclick = () => changeMedia(1);
            }
            
            // 更新箭头显示状态
            updateMediaControls();
        }

        // 渲染媒体导航点
        function renderMediaNav(totalMedia) {
            if (!totalMedia || totalMedia <= 1) return;
            
            const navContainer = document.getElementById('mediaNav');
            const dots = [];
            for (let i = 0; i < totalMedia; i++) {
                dots.push(`<div class="media-nav-dot ${i === currentMediaIndex ? 'active' : ''}" onclick="changeMediaTo(${i})"></div>`);
            }
            navContainer.innerHTML = dots.join('');
        }

        // 切换媒体
        function changeMedia(direction) {
            if (!currentProject) return;
            
            // 先停止当前播放的视频
            const currentVideo = document.querySelector('.modal-video');
            if (currentVideo) {
                if (currentVideo.tagName === 'VIDEO') {
                    currentVideo.pause();
                    currentVideo.currentTime = 0;
                } else if (currentVideo.tagName === 'IFRAME') {
                    // 对于 iframe，先移除 src 停止播放
                    currentVideo.src = '';
                }
            }
            
            // 计算总媒体数
            let totalMedia = 0;
            if (currentProject.video && currentProject.video.src) totalMedia++;
            if (currentProject.media) totalMedia += currentProject.media.length;
            
            if (totalMedia === 0) return;
            
            currentMediaIndex = (currentMediaIndex + direction + totalMedia) % totalMedia;
            renderMedia();
        }

        // 跳转到指定媒体
        function changeMediaTo(index) {
            if (!currentProject) return;
            
            // 先停止当前播放的视频
            const currentVideo = document.querySelector('.modal-video');
            if (currentVideo) {
                if (currentVideo.tagName === 'VIDEO') {
                    currentVideo.pause();
                    currentVideo.currentTime = 0;
                } else if (currentVideo.tagName === 'IFRAME') {
                    // 对于 iframe，先移除 src 停止播放
                    currentVideo.src = '';
                }
            }
            
            // 计算总媒体数
            let totalMedia = 0;
            if (currentProject.video && currentProject.video.src) totalMedia++;
            if (currentProject.media) totalMedia += currentProject.media.length;
            
            if (index < 0 || index >= totalMedia) return;
            
            currentMediaIndex = index;
            renderMedia();
        }

        // 更新媒体控制显示
        function updateMediaControls() {
            if (!currentProject) return;
            
            // 计算总媒体数（主视频 + 额外媒体）
            let totalMedia = 0;
            if (currentProject.video && currentProject.video.src) totalMedia++;
            if (currentProject.media) totalMedia += currentProject.media.length;
            
            const hasMultipleMedia = totalMedia > 1;
            const prevBtn = document.getElementById('mediaPrev');
            const nextBtn = document.getElementById('mediaNext');
            
            if (prevBtn && nextBtn) {
                if (hasMultipleMedia) {
                    prevBtn.classList.remove('hidden');
                    nextBtn.classList.remove('hidden');
                } else {
                    prevBtn.classList.add('hidden');
                    nextBtn.classList.add('hidden');
                }
            }
        }

        // 关闭弹出层
        function closeModal() {
            // 停止弹出层内的所有视频
            const modalVideos = document.querySelectorAll('.modal-video');
            modalVideos.forEach(video => {
                if (video.tagName === 'VIDEO') {
                    video.pause();
                    video.currentTime = 0;
                } else if (video.tagName === 'IFRAME') {
                    // 对于YouTube和Bilibili的iframe，移除src来停止播放
                    // 这样更彻底，避免音频继续播放
                    video.src = '';
                }
            });
            
            // 停止所有项目卡片上的预览视频
            const previewVideos = document.querySelectorAll('.preview-video');
            previewVideos.forEach(video => {
                video.pause();
                video.currentTime = 0;
            });
            
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
            currentProject = null;
            currentMediaIndex = 0;
        }

        // 事件监听
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // 分类切换
        document.querySelectorAll('.category-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                
                // 更新活动状态
                document.querySelectorAll('.category-link').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                
                // 渲染对应分类的项目
                const category = this.getAttribute('data-category');
                renderProjects(category);
            });
        });

        // ESC键关闭弹出层
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // 检测是否全屏
        function isFullscreen() {
            return !!(document.fullscreenElement || 
                     document.webkitFullscreenElement || 
                     document.mozFullScreenElement || 
                     document.msFullscreenElement);
        }

        // 尝试进入全屏
        function requestFullscreen() {
            const element = document.documentElement;
            if (element.requestFullscreen) {
                element.requestFullscreen();
            } else if (element.webkitRequestFullscreen) {
                element.webkitRequestFullscreen();
            } else if (element.mozRequestFullScreen) {
                element.mozRequestFullScreen();
            } else if (element.msRequestFullscreen) {
                element.msRequestFullscreen();
            }
        }

        // 页面加载时尝试全屏
        window.addEventListener('load', () => {
            // 延迟一点尝试全屏，避免被浏览器阻止
            setTimeout(() => {
                if (!isFullscreen()) {
                    requestFullscreen().catch(err => {
                        console.log('无法自动全屏，需要用户交互:', err);
                    });
                }
            }, 500);
        });

        // 窗口大小改变时重新布局和重新计算高度，或刷新页面
        let resizeTimer;
        let lastWindowWidth = window.innerWidth;
        let lastWindowHeight = window.innerHeight;
        let wasFullscreen = isFullscreen();

        // 检测是否为移动端（真正的手机设备，不包括iPad等平板）
        function isMobileDevice() {
            // 宽度 < 480px 认为是移动端
            if (window.innerWidth < 480) return true;
            
            // 通过User Agent检测，但排除iPad
            const ua = navigator.userAgent.toLowerCase();
            const isIPad = /ipad/.test(ua);
            if (isIPad) return false; // iPad使用桌面端布局
            
            // 其他移动设备
            return /android|webos|iphone|ipod|blackberry|iemobile|opera mini/i.test(ua);
        }

        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const currentFullscreen = isFullscreen();
                const widthChanged = Math.abs(window.innerWidth - lastWindowWidth) > 50;
                // 移动端：忽略高度变化（地址栏显示/隐藏会导致高度变化，但不应该刷新）
                // 桌面端：高度变化超过50px才刷新
                const heightChanged = isMobileDevice() 
                    ? false  // 移动端忽略高度变化
                    : Math.abs(window.innerHeight - lastWindowHeight) > 50;
                
                const isMobile = isMobileDevice();
                const fullscreenChanged = wasFullscreen !== currentFullscreen;
                
                // 判断是否需要刷新页面
                // 移动端：只在全屏状态改变或宽度显著改变时刷新（忽略高度变化）
                // 桌面端：全屏状态改变、宽度或高度显著改变时刷新
                const shouldReload = fullscreenChanged || widthChanged || heightChanged;
                
                if (shouldReload) {
                    // 移动端：如果只是高度变化（地址栏显示/隐藏），不刷新，只重新布局
                    if (isMobile && !fullscreenChanged && !widthChanged) {
                        // 移动端高度变化，只重新布局，不刷新
                        // 继续执行下面的布局代码
                    } else {
                        // 其他情况：刷新页面
                        window.location.reload();
                        return;
                    }
                }
                
                // 否则重新计算布局
                const cards = document.querySelectorAll('.project-card');
                cards.forEach(card => {
                    const imageContainer = card.querySelector('.project-image');
                    if (!imageContainer) return;
                    
                    const coverImage = card.querySelector('img.cover-image');
                    const previewVideo = card.querySelector('video.preview-video');
                    
                    // 优先使用视频的实际比例
                    if (previewVideo && previewVideo.videoWidth && previewVideo.videoHeight) {
                        const aspectRatio = previewVideo.videoHeight / previewVideo.videoWidth;
                        setImageContainerHeight(imageContainer, aspectRatio);
                    } 
                    // 如果没有视频，使用封面图的实际比例
                    else if (coverImage && coverImage.naturalWidth && coverImage.naturalHeight) {
                        const aspectRatio = coverImage.naturalHeight / coverImage.naturalWidth;
                        setImageContainerHeight(imageContainer, aspectRatio);
                    } 
                    // 只有在完全没有媒体时才使用默认值
                    else {
                        // 尝试等待一下，看是否有媒体正在加载
                        setTimeout(() => {
                            if (previewVideo && previewVideo.videoWidth && previewVideo.videoHeight) {
                                const aspectRatio = previewVideo.videoHeight / previewVideo.videoWidth;
                                setImageContainerHeight(imageContainer, aspectRatio);
                            } else if (coverImage && coverImage.naturalWidth && coverImage.naturalHeight) {
                                const aspectRatio = coverImage.naturalHeight / coverImage.naturalWidth;
                                setImageContainerHeight(imageContainer, aspectRatio);
                            } else {
                                setImageContainerHeight(imageContainer, 0.5625); // 默认16:9（仅作为最后的后备方案）
                            }
                        }, 500);
                    }
                });
                
                // 重新布局
                layoutMasonry();
                
                // 更新记录
                lastWindowWidth = window.innerWidth;
                lastWindowHeight = window.innerHeight;
                wasFullscreen = currentFullscreen;
            }, 250);
        });

        // 监听全屏状态变化（移动端不刷新，避免干扰视频播放）
        document.addEventListener('fullscreenchange', () => {
            if (isFullscreen() !== wasFullscreen && !isMobileDevice()) {
                setTimeout(() => window.location.reload(), 100);
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (isFullscreen() !== wasFullscreen && !isMobileDevice()) {
                setTimeout(() => window.location.reload(), 100);
            }
        });
        document.addEventListener('mozfullscreenchange', () => {
            if (isFullscreen() !== wasFullscreen && !isMobileDevice()) {
                setTimeout(() => window.location.reload(), 100);
            }
        });
        document.addEventListener('MSFullscreenChange', () => {
            if (isFullscreen() !== wasFullscreen && !isMobileDevice()) {
                setTimeout(() => window.location.reload(), 100);
            }
        });

        // 移动端视频播放控制
        let currentPlayingVideo = null;
        let videoObserver = null;
        let nextImageIndexToLoad = 1; // 下一个要加载的图片索引（第一个已经自动加载了）
        let allProjectCards = []; // 所有项目卡片
        let loadingVideos = new Set(); // 正在加载的视频集合，避免重复加载
        
        // 更新进度圆环
        function updateProgressRing(card, progress) {
            const progressBar = card.querySelector('.progress-bar');
            if (!progressBar) return;
            
            // 圆的周长 = 2 * PI * r，这里 r = 15.5
            const circumference = 2 * Math.PI * 15.5; // 约 97.4
            const offset = circumference - (progress / 100) * circumference;
            progressBar.style.strokeDashoffset = offset;
        }
        
        // 后台加载接下来的3张图片
        function loadNextImages() {
            // 只在移动端布局执行（宽度 <= 1024px）
            // 桌面端布局（> 1024px）使用桌面端逻辑
            if (window.innerWidth > 1024) return;
            
            const imagesToLoad = 3;
            let loadedCount = 0;
            
            console.log(`📸 开始加载后续${imagesToLoad}张图片，从索引${nextImageIndexToLoad}开始`);
            
            for (let i = 0; i < imagesToLoad; i++) {
                const index = nextImageIndexToLoad + i;
                
                if (index >= allProjectCards.length) {
                    console.log('✅ 所有图片已加载完成');
                    break;
                }
                
                const card = allProjectCards[index];
                const img = card.querySelector('.cover-image');
                
                if (img && img.tagName === 'IMG' && !img.complete) {
                    // 如果图片还未加载，强制加载
                    img.loading = 'eager';
                    
                    // 如果src还未设置，设置它
                    if (!img.src && img.getAttribute('data-src')) {
                        img.src = img.getAttribute('data-src');
                    }
                    
                    img.addEventListener('load', () => {
                        loadedCount++;
                        console.log(`✅ 图片 ${index + 1} 加载完成 (${loadedCount}/${imagesToLoad})`);
                    }, { once: true });
                    
                    img.addEventListener('error', () => {
                        loadedCount++;
                        console.log(`❌ 图片 ${index + 1} 加载失败 (${loadedCount}/${imagesToLoad})`);
                    }, { once: true });
                } else {
                    loadedCount++;
                }
            }
            
            // 更新下一个要加载的索引
            nextImageIndexToLoad += imagesToLoad;
        }
        
        function setupMobileVideoPlayback() {
            // 只在移动端布局启用（宽度 <= 1024px）
            // 桌面端布局（> 1024px）使用桌面端逻辑
            if (window.innerWidth > 1024) return;
            
            // 清理之前的观察器
            if (videoObserver) {
                videoObserver.disconnect();
                videoObserver = null;
            }
            
            // 初始化所有项目卡片和加载索引
            allProjectCards = Array.from(document.querySelectorAll('.project-card'));
            nextImageIndexToLoad = 1; // 第一张图片已经自动加载了
            
            console.log(`📱 初始化移动端加载策略，共${allProjectCards.length}个项目`);
            
            const cardsWithVideo = document.querySelectorAll('.project-card.has-video');
            if (cardsWithVideo.length === 0) return;
            
            // 立即加载并播放第一个视频
            const firstCard = cardsWithVideo[0];
            const firstVideo = firstCard.querySelector('.preview-video');
            if (firstVideo) {
                // 检查视频是否已经加载完成且正在播放，避免重复加载
                if (firstVideo.readyState >= 2 && !firstVideo.paused && currentPlayingVideo === firstVideo) {
                    // 视频已经加载完成且正在播放，不需要重新加载
                    console.log('✅ 第一个视频已加载完成且正在播放，跳过重复初始化');
                    return;
                }
                
                // 检查是否已经在加载中，避免重复加载
                if (loadingVideos.has(firstVideo) && currentPlayingVideo === firstVideo) {
                    console.log('ℹ️ 第一个视频已在加载中，跳过重复初始化');
                    return;
                }
                
                // 如果当前播放的不是第一个视频，暂停其他视频
                if (currentPlayingVideo && currentPlayingVideo !== firstVideo) {
                    currentPlayingVideo.pause();
                    currentPlayingVideo.currentTime = 0;
                    const prevCard = currentPlayingVideo.closest('.project-card');
                    if (prevCard) {
                        prevCard.classList.remove('in-viewport');
                        prevCard.classList.remove('video-loading');
                    }
                    loadingVideos.delete(currentPlayingVideo);
                }
                
                currentPlayingVideo = firstVideo;
                loadingVideos.add(firstVideo); // 标记为正在加载
                
                // 显示加载圆环（初始进度0%）
                firstCard.classList.add('video-loading');
                updateProgressRing(firstCard, 0);
                
                // 监听加载进度
                const onProgress = () => {
                    if (firstVideo.buffered.length > 0) {
                        const buffered = firstVideo.buffered.end(0);
                        const duration = firstVideo.duration;
                        if (duration > 0) {
                            const progress = (buffered / duration) * 100;
                            updateProgressRing(firstCard, progress);
                        }
                    }
                };
                
                // 监听视频加载进度到100%
                const onCanPlay = () => {
                    updateProgressRing(firstCard, 100);
                    console.log('✅ 视频加载到100%，等待播放...');
                };
                
                // 监听视频真正开始播放
                const onPlaying = () => {
                    console.log('🎬 第一个视频开始播放，隐藏圆环');
                    firstCard.classList.remove('video-loading');
                    firstCard.classList.add('in-viewport');
                    loadingVideos.delete(firstVideo); // 移除加载标记
                    
                    // 第一个视频开始播放后，加载后续3张图片
                    console.log('📸 开始后台加载后续图片');
                    loadNextImages();
                };
                
                // 监听错误
                const onError = () => {
                    console.log('❌ 第一个视频加载错误');
                    firstCard.classList.remove('video-loading');
                    loadingVideos.delete(firstVideo); // 移除加载标记
                };
                
                firstVideo.addEventListener('progress', onProgress);
                firstVideo.addEventListener('canplay', onCanPlay, { once: true });
                firstVideo.addEventListener('playing', onPlaying, { once: true });
                firstVideo.addEventListener('error', onError, { once: true });
                
                // 超时保护：15秒后如果还没播放，强制隐藏圆环
                setTimeout(() => {
                    if (firstCard.classList.contains('video-loading')) {
                        console.log('⏱️ 第一个视频加载超时，隐藏圆环');
                        firstCard.classList.remove('video-loading');
                        loadingVideos.delete(firstVideo); // 移除加载标记
                    }
                }, 15000);
                
                // 先加载视频（如果preload="none"且readyState === 0的话）
                // 避免重复加载已开始加载的视频
                if (firstVideo.preload === 'none' && firstVideo.readyState === 0) {
                    firstVideo.load();
                }
                firstVideo.play().catch(err => {
                    console.log('第一个视频播放失败:', err);
                    firstCard.classList.remove('video-loading');
                });
            }
            
            // 检测视频是否大部分可见（70%以上）
            function isMostlyVisible(card) {
                const rect = card.getBoundingClientRect();
                const viewportHeight = window.innerHeight;
                
                // 计算卡片在视口中的可见高度
                const visibleTop = Math.max(0, rect.top);
                const visibleBottom = Math.min(viewportHeight, rect.bottom);
                const visibleHeight = Math.max(0, visibleBottom - visibleTop);
                
                // 计算可见比例
                const visibleRatio = visibleHeight / rect.height;
                const isMostlyVisible = visibleRatio >= 0.7;
                
                // 只在大部分可见时输出日志
                if (isMostlyVisible) {
                    console.log(`✅ 找到大部分可见的视频:`, {
                        卡片高度: rect.height.toFixed(0) + 'px',
                        可见高度: visibleHeight.toFixed(0) + 'px',
                        可见比例: (visibleRatio * 100).toFixed(1) + '%',
                        top: rect.top.toFixed(0),
                        bottom: rect.bottom.toFixed(0)
                    });
                }
                
                // 如果可见高度大于等于卡片高度的70%，说明大部分可见
                return isMostlyVisible;
            }
            
            // 检测视频是否有一半离开屏幕
            function isHalfOutOfView(card) {
                const rect = card.getBoundingClientRect();
                const viewportHeight = window.innerHeight;
                
                // 计算卡片在视口中的可见高度
                const visibleTop = Math.max(0, rect.top);
                const visibleBottom = Math.min(viewportHeight, rect.bottom);
                const visibleHeight = Math.max(0, visibleBottom - visibleTop);
                
                // 如果可见高度小于卡片高度的一半，说明超过一半已经不在屏幕中
                return visibleHeight < rect.height / 2;
            }
            
            // 查找并播放大部分可见的视频
            function playVideoInCenter() {
                // 先检查当前播放的视频是否已经有一半离开屏幕
                if (currentPlayingVideo) {
                    const currentCard = currentPlayingVideo.closest('.project-card');
                    if (currentCard && isHalfOutOfView(currentCard)) {
                        // 当前视频有一半已经不在屏幕中，暂停它
                        currentPlayingVideo.pause();
                        currentPlayingVideo.currentTime = 0;
                        currentCard.classList.remove('in-viewport');
                        currentCard.classList.remove('video-loading');
                        currentPlayingVideo = null;
                        console.log('⏸️ 视频离开屏幕，已暂停');
                    }
                }
                
                // 查找大部分可见（70%以上）的视频并播放
                let foundVisibleVideo = false;
                for (let card of cardsWithVideo) {
                    if (isMostlyVisible(card)) {
                        foundVisibleVideo = true;
                        const video = card.querySelector('.preview-video');
                        
                        // 检查是否已经在加载或播放，以及是否已经加载完成
                        // 避免重复加载已加载完成的视频，减少流量消耗
                        if (video && video !== currentPlayingVideo && !loadingVideos.has(video)) {
                            // 检查视频是否已经加载完成（readyState >= 2 表示已有元数据，>= 3 表示已有足够数据）
                            // 如果已经加载完成，直接播放，不重新加载
                            if (video.readyState >= 2) {
                                console.log('🎬 检测到视频已加载完成，直接播放（不重新加载）');
                                
                                // 暂停之前的视频
                                if (currentPlayingVideo) {
                                    currentPlayingVideo.pause();
                                    currentPlayingVideo.currentTime = 0;
                                    const prevCard = currentPlayingVideo.closest('.project-card');
                                    if (prevCard) {
                                        prevCard.classList.remove('in-viewport');
                                        prevCard.classList.remove('video-loading');
                                    }
                                }
                                
                                // 直接播放已加载的视频
                                currentPlayingVideo = video;
                                card.classList.add('in-viewport');
                                video.play().catch(err => {
                                    console.log('视频播放失败:', err);
                                });
                                continue; // 跳过加载逻辑
                            }
                            
                            console.log('🎬 检测到新视频大部分可见，开始加载');
                            
                            // 标记为正在加载
                            loadingVideos.add(video);
                            
                            // 暂停之前的视频
                            if (currentPlayingVideo) {
                                currentPlayingVideo.pause();
                                currentPlayingVideo.currentTime = 0;
                                const prevCard = currentPlayingVideo.closest('.project-card');
                                if (prevCard) {
                                    prevCard.classList.remove('in-viewport');
                                    prevCard.classList.remove('video-loading');
                                }
                            }
                            
                            // 显示加载圆环（初始进度0%）
                            card.classList.add('video-loading');
                            updateProgressRing(card, 0);
                            currentPlayingVideo = video;
                            
                            // 监听加载进度
                            const onProgress = () => {
                                if (video.buffered.length > 0) {
                                    const buffered = video.buffered.end(0);
                                    const duration = video.duration;
                                    if (duration > 0) {
                                        const progress = (buffered / duration) * 100;
                                        updateProgressRing(card, progress);
                                    }
                                }
                            };
                            
                            // 监听视频加载进度到100%
                            const onCanPlay = () => {
                                console.log('✅ 视频加载到100%，等待播放...');
                                updateProgressRing(card, 100);
                            };
                            
                            // 监听视频真正开始播放
                            const onPlaying = () => {
                                console.log('🎬 视频开始播放，隐藏圆环');
                                card.classList.remove('video-loading');
                                card.classList.add('in-viewport');
                                loadingVideos.delete(video); // 移除加载标记
                                
                                // 每次视频开始播放后，继续加载后续3张图片
                                console.log('📸 开始后台加载后续图片');
                                loadNextImages();
                            };
                            
                            // 监听错误
                            const onError = () => {
                                console.log('❌ 视频加载错误');
                                card.classList.remove('video-loading');
                                loadingVideos.delete(video); // 移除加载标记
                            };
                            
                            video.addEventListener('progress', onProgress);
                            video.addEventListener('canplay', onCanPlay, { once: true });
                            video.addEventListener('playing', onPlaying, { once: true });
                            video.addEventListener('error', onError, { once: true });
                            
                            // 超时保护：15秒后如果还没播放，强制隐藏圆环
                            setTimeout(() => {
                                if (card.classList.contains('video-loading')) {
                                    console.log('⏱️ 视频加载超时，隐藏圆环');
                                    card.classList.remove('video-loading');
                                    loadingVideos.delete(video); // 移除加载标记
                                }
                            }, 15000);
                            
                            // 先加载视频（如果preload="none"且readyState === 0的话）
                            // 避免重复加载已开始加载的视频
                            if (video.preload === 'none' && video.readyState === 0) {
                                video.load();
                            }
                            video.play().catch(err => {
                                console.log('视频播放失败:', err);
                                card.classList.remove('video-loading');
                            });
                        }
                        
                        break; // 只播放一个视频
                    }
                }
                
                // 移除不必要的日志，避免刷屏
                // if (!foundVisibleVideo) {
                //     console.log('ℹ️ 没有找到大部分可见（70%以上）的视频');
                // }
            }
            
            // 监听滚动事件（优化：减少频繁触发）
            let scrollTimeout;
            let lastScrollCheck = 0;
            let isChecking = false; // 防止重复检查
            const handleScroll = () => {
                const now = Date.now();
                
                // 节流：每200ms最多检查一次暂停逻辑
                if (now - lastScrollCheck > 200) {
                    lastScrollCheck = now;
                    
                    // 检查当前视频是否有一半离开屏幕
                    if (currentPlayingVideo) {
                        const currentCard = currentPlayingVideo.closest('.project-card');
                        if (currentCard && isHalfOutOfView(currentCard)) {
                            // 有一半离开屏幕，暂停
                            currentPlayingVideo.pause();
                            currentPlayingVideo.currentTime = 0;
                            currentCard.classList.remove('in-viewport');
                            currentCard.classList.remove('video-loading');
                            loadingVideos.delete(currentPlayingVideo); // 移除加载标记
                            currentPlayingVideo = null;
                            console.log('⏸️ 滚动中检测到视频离开，已暂停');
                        }
                    }
                }
                
                // 滚动停止500ms后检查并播放大部分可见的视频
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    if (isChecking) {
                        console.log('⚠️ 正在检查中，跳过重复检查');
                        return;
                    }
                    isChecking = true;
                    console.log('🔍 滚动停止，检查可播放视频');
                    playVideoInCenter();
                    isChecking = false;
                }, 500);
            };
            
            window.addEventListener('scroll', handleScroll, { passive: true });
            
            // 也监听scrollend事件（如果支持）
            if ('onscrollend' in window) {
                window.addEventListener('scrollend', () => {
                    if (isChecking) {
                        console.log('⚠️ scrollend: 正在检查中，跳过');
                        return;
                    }
                    isChecking = true;
                    console.log('🔍 scrollend事件触发，检查可播放视频');
                    playVideoInCenter();
                    isChecking = false;
                }, { passive: true });
            }
        }
        
        // 在项目渲染后设置视频播放控制
        const originalRenderProjects = renderProjects;
        renderProjects = function(category) {
            originalRenderProjects(category);
            // 延迟一下，确保DOM已更新
            setTimeout(() => {
                setupMobileVideoPlayback();
            }, 100);
        };
        
        // 窗口大小改变时重新设置
        window.addEventListener('resize', () => {
            setTimeout(() => {
                setupMobileVideoPlayback();
            }, 100);
        });

        // 初始化渲染 - 默认显示All页面
        renderProjects('all');
    </script>
</body>
</html>
