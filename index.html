<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            font-weight: 400;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 280px;
            background-color: #0a0a0a;
            border-right: 1px solid #1a1a1a;
            padding: 50px 30px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h1 {
            font-size: 50.96px; /* 39.2px * 1.3 */
            margin-bottom: 60px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            margin-bottom: 10px;
        }

        .category-link {
            text-decoration: none;
            color: #666666;
            font-size: 29.12px; /* 22.4px * 1.3 */
            display: inline-block;
            padding: 8px 0;
            transition: color 0.4s ease;
            position: relative;
            letter-spacing: 0.5px;
        }

        .category-link:hover {
            color: #ffffff;
            filter: blur(0px);
            animation: blurEffect 0.6s ease-in-out;
        }

        @keyframes blurEffect {
            0% {
                filter: blur(0px);
            }
            50% {
                filter: blur(3px);
            }
            100% {
                filter: blur(0px);
            }
        }

        .category-link.active {
            color: #b19cd9;
        }

        /* 顶部装饰文字 */
        .header-decoration {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
        }

        .header-decoration .main-title {
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 25.92px;
            color: #ffffff;
            opacity: 0.9;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .header-decoration .subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            color: #999999;
            letter-spacing: 2px;
            font-weight: 400;
            text-transform: uppercase;
        }

        /* 主要内容区域 */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 150px 60px 50px 60px;
        }

        .page-title {
            display: none;
        }
        
        /* 移动端提示文字 - 桌面端默认隐藏 */
        .mobile-tip {
            display: none;
        }

        /* 项目网格 - 瀑布流布局 */
        .projects-grid {
            position: relative;
            margin-bottom: 80px;
            visibility: hidden;
            opacity: 0;
        }
        
        .projects-grid.loaded {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .project-card {
            background-color: #111111;
            border-radius: 0;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s ease, opacity 0.4s ease;
            border: 1px solid #1a1a1a;
            position: absolute;
            margin-bottom: 40px;
        }

        /* 不同尺寸的项目卡片 */
        .project-card.size-mini {
            width: calc((100% - 160px) / 5); /* 1/5宽度，最小尺寸 */
        }

        .project-card.size-tiny {
            width: calc((100% - 120px) / 4); /* 1/4宽度 */
        }

        .project-card.size-small {
            width: calc((100% - 80px) / 3); /* 1/3宽度 */
        }

        .project-card.size-regular {
            width: calc((100% - 60px) / 2.5); /* 2/5宽度，介于small和medium之间 */
        }

        .project-card.size-big {
            width: calc((100% - 40px) / 2); /* 1/2宽度 */
        }

        .project-card.size-medium {
            width: calc(100% * 0.45); /* 45%宽度，介于regular和big之间 */
        }

        .project-card.size-extra {
            width: calc((100% - 35px) / 1.5); /* 2/3宽度 */
        }

        .project-card.size-large {
            width: calc((100% - 14px) / 1.2); /* 5/6宽度，介于extra和super之间 */
        }

        .project-card.size-super {
            width: 100%; /* 全宽 */
        }

        .project-card:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .project-image {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 默认16:9比例，加载后会被实际比例覆盖 */
            min-height: 200px; /* 最小高度 */
            max-height: 800px; /* 最大高度 */
            object-fit: cover;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333333;
            font-size: 13px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .project-image img,
        .project-image video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .project-image .cover-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .project-image .cover-image[src=""] {
            display: none;
        }

        .project-image .preview-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* 视频加载进度圆环（默认隐藏） */
        .video-loading-spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            z-index: 3;
        }
        
        .video-loading-spinner svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); /* 从顶部开始 */
        }
        
        .video-loading-spinner .progress-bg {
            fill: none;
            stroke: #333;
            stroke-width: 5;
        }
        
        .video-loading-spinner .progress-bar {
            fill: none;
            stroke: #fff;
            stroke-width: 5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s ease;
        }

        .project-card.has-video:hover .cover-image {
            opacity: 0; /* 只有在有预览视频时才隐藏封面图 */
        }

        .project-info {
            padding: 24px;
            background-color: #0f0f0f;
        }

        .project-title {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background-color: transparent;
            border: 1px solid #2a2a2a;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 11px;
            color: #888888;
            letter-spacing: 0.5px;
        }

        /* 弹出层 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            animation: fadeIn 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background-color: #111111;
            border-radius: 0;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.4s ease;
            border: 1px solid #1a1a1a;
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 30px;
            right: 30px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid #2a2a2a;
            width: 40px;
            height: 40px;
            border-radius: 0;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
        }

        .modal-media-container {
            width: 100%;
            position: relative;
            background: #000000;
        }

        .modal-image {
            width: 100%;
            height: 585px; /* 450px * 1.3 */
            object-fit: contain;
            background: #000000;
            display: block;
        }

        .modal-video {
            width: 100%;
            height: 585px; /* 450px * 1.3 */
            background: #000000;
        }

        .media-placeholder {
            width: 100%;
            height: 585px; /* 450px * 1.3 */
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333333;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        /* 媒体轮播控制 */
        .media-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 5;
        }

        .media-nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .media-nav-dot.active {
            background: #b19cd9; /* 浅紫色 */
            width: 24px;
            border-radius: 4px;
        }

        .media-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: transparent; /* 移除背景 */
            border: none; /* 移除外框 */
            color: #ffffff;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 64px; /* 从 32px 增加到 64px（放大一倍） */
            font-weight: 100; /* 细字体 */
            font-family: 'Outfit', sans-serif; /* 使用 Outfit 字体 */
            transition: all 0.3s ease;
            z-index: 5;
        }

        .media-arrow:hover {
            color: rgba(255, 255, 255, 0.8); /* 悬停时稍微变暗 */
        }

        .media-arrow.prev {
            left: 20px;
        }

        .media-arrow.next {
            right: 20px;
        }

        .media-arrow.hidden {
            display: none;
        }

        .modal-body {
            padding: 50px;
        }

        .modal-title {
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 24px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 35px;
        }

        .modal-tag {
            background-color: transparent;
            border: 1px solid #2a2a2a;
            padding: 5.6px 18px;
            border-radius: 16px;
            font-size: 12px;
            color: #888888;
            letter-spacing: 0.5px;
        }

        .modal-description {
            font-size: 15px;
            line-height: 1.9;
            color: #999999;
            margin-bottom: 30px;
            letter-spacing: 0.3px;
        }

        .modal-details {
            border-top: 1px solid #1a1a1a;
            padding-top: 30px;
            margin-top: 30px;
        }

        .detail-item {
            margin-bottom: 20px;
        }

        .detail-label {
            font-weight: 400;
            color: #666666;
            margin-bottom: 8px;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .detail-value {
            color: #ffffff;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        /* 响应式设计 */
        /* 移动端布局：<= 1024px（包括手机和平板） */
        /* 桌面端布局：> 1024px */
        @media (max-width: 1024px) {
            /* 顶部装饰文字 - 移动端居中显示 */
            .header-decoration {
                position: fixed;
                top: 15px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 101;
                text-align: center;
            }

            .header-decoration .main-title {
                font-size: 16px;
                margin-bottom: 2px;
            }

            .header-decoration .subtitle {
                font-size: 9px;
            }

            /* 侧边栏 - 移动端改为固定在顶部，在FuWei文字下方 */
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: auto;
                background-color: #0a0a0a;
                border-right: none;
                border-bottom: 1px solid #1a1a1a;
                padding: 50px 15px 15px 15px; /* 顶部padding为FuWei文字留出空间 */
                z-index: 100;
            }

            .sidebar h1 {
                display: none; /* 隐藏Portfolio标题 */
            }

            .category-list {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 15px;
                margin-top: 0;
                justify-content: center; /* 目录居中 */
            }

            .category-item {
                margin-bottom: 0;
            }

            .category-link {
                font-size: 18px; /* 目录字体大小 */
                padding: 4px 0;
            }
            
            /* 移动端提示文字 */
            .mobile-tip {
                display: block;
                text-align: center;
                font-size: 13px;
                color: #666666;
                margin-top: 10px;
                padding: 0 15px;
                line-height: 1.5;
            }

            /* 主要内容区域 - 从目录下方开始，取消左右padding让项目占满屏幕 */
            .main-content {
                margin-left: 0;
                padding: 100px 0 20px 0; /* 取消左右padding，让项目占满屏幕宽度 */
            }

            /* 项目网格 - 移动端确保没有额外margin和padding */
            .projects-grid {
                margin-left: 0;
                margin-right: 0;
                margin-bottom: 20px; /* 减少底部margin */
                padding: 0;
                display: block !important; /* 移动端使用block，让项目自然垂直排列 */
                position: relative !important;
            }

            .project-card {
                width: 100vw !important; /* 移动端固定屏幕宽度 */
                position: relative !important; /* 移动端使用relative，直接垂直排列 */
                left: auto !important;
                top: auto !important;
                transform: none !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                margin-bottom: 5px !important; /* 减少项目之间的间距 */
                border: none !important; /* 移除所有边框 */
                padding: 0 !important; /* 移除所有padding */
                box-sizing: border-box !important;
            }
            
            .project-card.size-mini,
            .project-card.size-tiny,
            .project-card.size-small,
            .project-card.size-regular,
            .project-card.size-big,
            .project-card.size-medium,
            .project-card.size-extra,
            .project-card.size-large,
            .project-card.size-super {
                width: 100vw !important; /* 所有size在移动端都是屏幕宽度 */
            }
            
            .project-image {
                width: 100vw !important; /* 移动端固定屏幕宽度 */
                height: 0 !important;
                padding-bottom: 100% !important; /* 默认 1:1 正方形比例 */
                min-height: 0 !important;
                margin: 0 !important;
                max-width: none !important; /* 移除最大宽度限制 */
                box-sizing: border-box !important;
                position: relative !important; /* 确保绝对定位的子元素能正确定位 */
                overflow: hidden !important;
                transition: padding-bottom 0.3s ease; /* 平滑过渡 */
            }
            
            /* 横版视频：4:3 比例 (宽度较大) */
            .project-card.video-landscape .project-image {
                padding-bottom: 75% !important; /* 4:3 = 3/4 = 0.75 */
            }
            
            /* 竖版视频：3:4 比例 (高度较大) */
            .project-card.video-portrait .project-image {
                padding-bottom: 133.33% !important; /* 3:4 = 4/3 = 1.3333 */
            }
            
            /* 移动端保持absolute定位，封面图覆盖视频，不拼接 */
            .project-image .cover-image {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important; /* 相对于容器100% */
                height: 100% !important;
                object-fit: contain !important;
                z-index: 2;
            }
            
            .project-image .preview-video {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important; /* 相对于容器100% */
                height: 100% !important;
                object-fit: contain !important;
                z-index: 1;
            }
            
            /* 移动端：当项目进入视口时，隐藏封面图显示视频 */
            .project-card.has-video.in-viewport .cover-image {
                opacity: 0;
            }
            
            /* 移动端：视频加载时显示圆环 */
            .project-card.video-loading .video-loading-spinner {
                display: block;
            }

            .modal-content {
                margin: 20px;
                max-width: calc(100vw - 40px);
            }

            .modal-body {
                padding: 30px 25px;
            }

            .modal-close {
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部装饰文字 -->
    <div class="header-decoration">
        <div class="main-title">FuWei</div>
        <div class="subtitle">Multimedia Designer</div>
    </div>

    <div class="container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <h1>Portfolio</h1>
            <nav>
                <ul class="category-list">
                    <li class="category-item">
                        <a href="#all" class="category-link active" data-category="all">All</a>
                    </li>
                    <li class="category-item">
                        <a href="#3d-video" class="category-link" data-category="3d-video">3D Video</a>
                    </li>
                    <li class="category-item">
                        <a href="#2d-motion" class="category-link" data-category="2d-motion">2D Motion</a>
                    </li>
                    <li class="category-item">
                        <a href="#aigc" class="category-link" data-category="aigc">AIGC</a>
                    </li>
                    <li class="category-item">
                        <a href="#other" class="category-link" data-category="other">Other</a>
                    </li>
                </ul>
            </nav>
            <div class="mobile-tip">* 视频内容较多，推荐电脑端浏览以获得更佳体验 *</div>
        </aside>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <h2 class="page-title">Selected Works</h2>
            
            <!-- 项目网格 -->
            <div class="projects-grid" id="projectsGrid">
                <!-- 项目将通过JavaScript动态生成 -->
            </div>
        </main>
    </div>

    <!-- 弹出层 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-media-container" id="modalMediaContainer">
                <div class="media-placeholder">Project Media</div>
                <div class="media-arrow prev hidden" id="mediaPrev">‹</div>
                <div class="media-arrow next hidden" id="mediaNext">›</div>
                <div class="media-nav" id="mediaNav"></div>
            </div>
            <div class="modal-body">
                <h3 class="modal-title" id="modalTitle">Project Title</h3>
                <div class="modal-tags" id="modalTags"></div>
                <div class="modal-description" id="modalDescription">Project Description</div>
                <div class="modal-details">
                    <div class="detail-item">
                        <div class="detail-label">Time</div>
                        <div class="detail-value" id="modalTime">2024</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Tools</div>
                        <div class="detail-value" id="modalTools">Photoshop, Illustrator</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 阿里云OSS基础URL配置（仅移动端使用，桌面端不使用以避免流量消耗）
        const OSS_BASE_URL = 'https://portfolio-fuwei.oss-cn-shanghai.aliyuncs.com/';
        
        // 资源路径处理函数：仅移动端使用OSS，桌面端使用本地文件
        function getResourceUrl(path) {
            // 如果路径已经是完整URL（以http开头），直接返回
            if (path && path.startsWith('http')) {
                return path;
            }
            
            // 检测是否为移动端（宽度 < 480px，真正的手机设备）
            // iPad等平板设备（480px-1024px）使用移动端布局但使用本地文件，不使用OSS
            // 桌面端（> 1024px）使用桌面端布局和本地文件，不使用OSS
            // 只有 < 480px 的设备使用OSS，避免产生流量费用
            const isMobile = window.innerWidth < 480;
            
            if (isMobile) {
                // 移动端：使用阿里云OSS加速加载（仅限移动端）
                return OSS_BASE_URL + path;
            } else {

        // 计算并设置合理的高度（带限制）
        function setImageContainerHeight(imageContainer, aspectRatio) {
            if (!imageContainer) return;
            
            // 检查是否是移动端布局（宽度 <= 1024px）
            // 移动端布局：不改变容器高度，保持固定的 padding-bottom，避免布局跳动
            // 桌面端布局（> 1024px）：使用动态高度计算
            const isMobileLayout = window.innerWidth <= 1024;
            
            // 移动端布局：内容通过 object-fit: contain 适应容器
            if (isMobileLayout) {
                const coverImage = imageContainer.querySelector('img.cover-image');
                const previewVideo = imageContainer.querySelector('video.preview-video');
                
                if (coverImage) {
                    coverImage.style.setProperty('object-fit', 'contain', 'important');
                    coverImage.style.setProperty('width', '100%', 'important');
                    coverImage.style.setProperty('height', '100%', 'important');
                }
                if (previewVideo) {
                    previewVideo.style.setProperty('object-fit', 'contain', 'important');
                    previewVideo.style.setProperty('width', '100%', 'important');
                    previewVideo.style.setProperty('height', '100%', 'important');
                }
                return;
            }
            
            // 桌面端：继续使用原有逻辑
            // 尝试获取容器宽度，如果还没有渲染完成，等待一下
            let containerWidth = imageContainer.offsetWidth;
            if (!containerWidth) {
                const card = imageContainer.closest('.project-card');
                if (card) {
                    containerWidth = card.offsetWidth;
                }
            }
            
            // 如果还是获取不到，使用默认值或延迟执行
            if (!containerWidth) {
                setTimeout(() => setImageContainerHeight(imageContainer, aspectRatio), 100);
                return;
            }
            
            // 桌面端：计算实际高度（保持原始比例）
            let calculatedHeight = containerWidth * aspectRatio;
            
            // 限制高度范围（最小200px，最大800px）
            const minHeight = 200;
            const maxHeight = 800;
            
            // 判断是否需要使用contain模式来保持原比例
            const needsContain = calculatedHeight > maxHeight;
            
            // 如果高度超过最大限制，使用contain模式并限制高度
            if (calculatedHeight > maxHeight) {
                calculatedHeight = maxHeight;
            } else if (calculatedHeight < minHeight) {
                calculatedHeight = minHeight;
            }
            
            // 使用固定高度，保持原始宽高比
            imageContainer.style.height = calculatedHeight + 'px';
            imageContainer.style.paddingBottom = '0';
            
            // 始终使用contain模式来保持原始比例，不裁剪
            const coverImage = imageContainer.querySelector('img.cover-image');
            const previewVideo = imageContainer.querySelector('video.preview-video');
            
            if (coverImage) {
                coverImage.style.objectFit = 'contain';
            }
            if (previewVideo) {
                previewVideo.style.objectFit = 'contain';
            }
        }

        // 更新图片宽高比（带高度限制）
        function updateImageAspectRatio(img) {
            if (!img || !img.naturalWidth || !img.naturalHeight) return;
            
            const imageContainer = img.closest('.project-image');
            if (!imageContainer) return;
            
            // 计算实际宽高比
            const aspectRatio = img.naturalHeight / img.naturalWidth;
            setImageContainerHeight(imageContainer, aspectRatio);
            
            // 重新布局
            setTimeout(() => layoutMasonry(), 50);
        }

        // 更新视频宽高比（带高度限制）
        function updateVideoAspectRatio(video) {
            if (!video || !video.videoWidth || !video.videoHeight) return;
            
            const imageContainer = video.closest('.project-image');
            if (!imageContainer) return;
            
            // 计算实际宽高比
            const aspectRatio = video.videoHeight / video.videoWidth;
            setImageContainerHeight(imageContainer, aspectRatio);
            
            // 重新布局
            setTimeout(() => layoutMasonry(), 50);
        }

        // 灵活的瀑布流布局函数（不固定列数，根据项目比例和size灵活排布）
        let isLayouting = false;
        function layoutMasonry() {
            const grid = document.getElementById('projectsGrid');
            const cards = grid.querySelectorAll('.project-card');
            if (cards.length === 0) {
                grid.style.height = 'auto';
                return;
            }

            // 防止重复布局
            if (isLayouting) return;
            isLayouting = true;

            const gridWidth = grid.offsetWidth;
            // 如果 gridWidth 为 0 或无效，等待一下再重试
            if (!gridWidth || gridWidth === 0) {
                setTimeout(() => layoutMasonry(), 100);
                isLayouting = false;
                return;
            }
            
            // 获取窗口宽度来判断布局模式
            const windowWidth = window.innerWidth;
            
            // 移动端布局使用更小的间距（窗口宽度 <= 1024px）
            // 桌面端布局（窗口宽度 > 1024px）使用更大的间距
            // 但如果 gridWidth 太小（< 800px），使用较小的间距以适应小窗口
            const gap = windowWidth <= 1024 ? 5 : (gridWidth < 800 ? 20 : 70);
            
            // 记录已放置项目的占用区域 [x, y, width, height]
            const placedItems = [];
            
            // 为每个卡片计算位置
            cards.forEach((card) => {
                // 获取卡片尺寸
                const size = card.classList.contains('size-super') ? 'super' :
                            card.classList.contains('size-large') ? 'large' :
                            card.classList.contains('size-extra') ? 'extra' :
                            card.classList.contains('size-medium') ? 'medium' :
                            card.classList.contains('size-big') ? 'big' :
                            card.classList.contains('size-regular') ? 'regular' :
                            card.classList.contains('size-small') ? 'small' :
                            card.classList.contains('size-tiny') ? 'tiny' :
                            card.classList.contains('size-mini') ? 'mini' : 'small';
                
                // 移动端布局：单列排布（所有卡片屏幕宽度，窗口宽度 <= 1024px）
                // 桌面端布局（窗口宽度 > 1024px）：瀑布流布局
                const isSmallWindow = windowWidth <= 1024;
                
                // 移动端：直接使用flex布局，不需要复杂计算
                if (isSmallWindow) {
                    // 移动端不需要设置left和top，让flex自然排列
                    card.style.left = 'auto';
                    card.style.top = 'auto';
                    card.style.width = window.innerWidth + 'px';
                    // 不需要记录到placedItems，因为flex会自动排列
                    return; // 移动端处理完毕，跳过后续逻辑
                }
                
                // 根据size计算卡片宽度（桌面端）
                let cardWidth;
                if (size === 'super') {
                    cardWidth = gridWidth; // 100%宽度
                } else if (size === 'large') {
                    cardWidth = (gridWidth - gap * 0.2) / 1.2; // 5/6宽度
                } else if (size === 'extra') {
                    cardWidth = (gridWidth - gap * 0.5) / 1.5; // 2/3宽度
                } else if (size === 'big') {
                    cardWidth = (gridWidth - gap) / 2; // 1/2宽度
                } else if (size === 'medium') {
                    cardWidth = gridWidth * 0.45; // 45%宽度
                } else if (size === 'regular') {
                    cardWidth = (gridWidth - gap * 1.5) / 2.5; // 2/5宽度
                } else if (size === 'small') {
                    cardWidth = (gridWidth - gap * 2) / 3;
                } else if (size === 'tiny') {
                    cardWidth = (gridWidth - gap * 3) / 4;
                } else {
                    // mini: 使用1/5宽度
                    cardWidth = (gridWidth - gap * 4) / 5;

                // 获取卡片实际高度

                            const aspectRatio = parseFloat(paddingBottom) / 100;
                            cardHeight = cardWidth / aspectRatio + 100; // 加上标题等高度
                        } else {
                            // 默认使用 4:3 比例
                            cardHeight = cardWidth * 0.75 + 100;

                    } else {
                        // 如果完全没有高度，使用默认值
                        cardHeight = cardWidth * 0.75 + 100;
                    }
                }
                
                // 确保 cardWidth 不超过 gridWidth
                if (cardWidth > gridWidth) {
                    cardWidth = gridWidth;
                }
                
                // 确保 cardWidth 和 cardHeight 都是有效值
                if (!cardWidth || cardWidth <= 0 || !cardHeight || cardHeight <= 0) {
